services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  bot:
    build:
      dockerfile: Dockerfile
    container_name: rag_bot
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama
    stdin_open: true
    tty: true
    restart: unless-stopped

  updater:
    build:
      context: .
      dockerfile: Dockerfile.updater
    container_name: rag_updater
    depends_on:
      - ollama
    volumes:
      - ./task2/knowledge_base:/app/knowledge_base       # источник новых документов
      - ./task3/chroma_index:/app/chroma_index           # существующий индекс
      - ./task6:/app/logs
    restart: unless-stopped

volumes:
  ollama_data: